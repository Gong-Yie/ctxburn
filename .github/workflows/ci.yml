name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: end to end
        run: |
          ctxburn demo -o demo.jsonl
          ctxburn report demo.jsonl -o report.html
          python -c "import pathlib,sys; p=pathlib.Path('report.html'); sys.exit(0 if p.stat().st_size > 20000 else 1)"
